name: AI Telegram Auto Poster

on:
  schedule:
    - cron: "30 4 * * *"
    - cron: "30 14 * * *"
  workflow_dispatch:

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Hugging Face library
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade huggingface_hub

      - name: Generate images and post to Telegram
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          cat > bot.py <<'PY'
          import datetime
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          from huggingface_hub import InferenceClient


          GEMINI_KEY = os.environ["GEMINI_API_KEY"]
          HF_TOKEN = os.environ["HF_TOKEN"]
          BOT_TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]

          CHANNEL = "@BHUVIAIPROMPTIMAGES"


          THEMES = [
              "dark futuristic game developer",
              "cyberpunk programmer",
              "futuristic AI engineer",
              "dark gaming workstation",
              "neon game development studio",
              "cyberpunk city at midnight",
              "mysterious digital creator",
              "futuristic hacker workstation",
              "dark futuristic technology",
              "AI laboratory at night",
              "neon-lit software developer",
              "futuristic virtual reality creator",
              "dark sci-fi command center",
              "cyberpunk game designer",
              "future technology architect",
              "digital artist in a futuristic studio",
              "dark robotics engineer",
              "futuristic computer scientist",
              "neon-lit creative studio",
              "post-apocalyptic programmer",
          ]


          IST = datetime.timezone(datetime.timedelta(hours=5, minutes=30))
          now = datetime.datetime.now(IST)

          # 04:30 UTC = 10:00 IST
          # 14:30 UTC = 20:00 IST
          slot = 0 if now.hour < 15 else 1

          day_number = now.timetuple().tm_yday

          theme_index = (
              ((day_number - 1) * 2 + slot)
              % len(THEMES)
          )

          theme = THEMES[theme_index]


          STYLE = """
          Maintain a consistent premium dark cinematic visual identity.

          Deep blacks and charcoal shadows.
          Subtle cool-toned highlights.
          Dramatic cinematic lighting.
          Realistic materials.
          Atmospheric depth.
          Sophisticated composition.
          Realistic proportions.
          Highly detailed textures.
          Professional photography aesthetics.
          Strong contrast.
          Moody atmosphere.

          No visible text.
          No watermark.
          No logo.
          No random letters.
          No distorted anatomy.
          No malformed hands.
          No extra fingers.
          No duplicated objects.
          """


          PROMPT_REQUEST = f"""
          You are an expert AI image prompt engineer.

          Today's visual theme:

          {theme}

          Permanent visual identity:

          {STYLE}

          Create EXACTLY 4 completely different image concepts based on the same
          theme and visual identity.

          The four images must clearly belong to the same collection, but each must
          have a different:

          - scene
          - composition
          - environment
          - subject action
          - camera perspective

          For EACH image create an extremely detailed image-generation prompt.

          Each prompt MUST describe:

          - main subject
          - subject appearance
          - clothing
          - materials
          - pose
          - action
          - environment
          - background
          - important objects
          - foreground
          - lighting direction
          - lighting quality
          - shadows
          - atmosphere
          - color palette
          - camera angle
          - camera distance
          - lens
          - depth of field
          - composition
          - perspective
          - realism
          - texture
          - fine details
          - cinematic mood
          - negative prompt instructions

          Make every prompt detailed enough that another person could paste it
          directly into an image generator and recreate a very similar image.

          Make the four prompts substantially different from one another.

          Return ONLY valid JSON.

          Use exactly this format:

          {{
            "title": "short collection title",
            "prompts": [
              "very detailed prompt 1",
              "very detailed prompt 2",
              "very detailed prompt 3",
              "very detailed prompt 4"
            ]
          }}
          """


          def gemini_generate_prompts():
              url = (
                  "https://generativelanguage.googleapis.com/v1beta/models/"
                  "gemini-3.6-flash:generateContent"
              )

              payload = {
                  "contents": [
                      {
                          "parts": [
                              {
                                  "text": PROMPT_REQUEST
                              }
                          ]
                      }
                  ],
                  "generationConfig": {
                      "responseMimeType": "application/json"
                  },
              }

              request = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Content-Type": "application/json",
                      "x-goog-api-key": GEMINI_KEY,
                  },
                  method="POST",
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=120
                  ) as response:
                      result = json.loads(
                          response.read().decode("utf-8")
                      )

              except urllib.error.HTTPError as error:
                  error_body = error.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  print("Gemini HTTP error:")
                  print(error_body)

                  raise

              try:
                  text = (
                      result["candidates"][0]
                      ["content"]["parts"][0]["text"]
                  )

              except (KeyError, IndexError) as error:
                  print("Unexpected Gemini response:")
                  print(
                      json.dumps(
                          result,
                          indent=2
                      )[:4000]
                  )

                  raise Exception(
                      "Could not find generated text in Gemini response"
                  ) from error

              try:
                  return json.loads(text)

              except json.JSONDecodeError as error:
                  print("Gemini returned invalid JSON:")
                  print(text)

                  raise Exception(
                      "Gemini response was not valid JSON"
                  ) from error


          def download_image(prompt, filename):
              print(
                  f"Generating Hugging Face image: {filename}"
              )

              client = InferenceClient(
                  provider="auto",
                  api_key=HF_TOKEN,
              )

              try:
                  image = client.text_to_image(
                      prompt=prompt,
                      model="black-forest-labs/FLUX.1-schnell",
                  )

              except Exception as error:
                  print(
                      "Hugging Face image generation failed:"
                  )
                  print(str(error))

                  raise

              try:
                  image = image.convert("RGB")
                  image.save(
                      filename,
                      format="JPEG",
                      quality=95
                  )

              except Exception as error:
                  print(
                      f"Could not save {filename}:"
                  )
                  print(str(error))

                  raise

              print(
                  f"Generated successfully: {filename}"
              )


          def telegram_request(
              method,
              data,
              content_type="application/x-www-form-urlencoded"
          ):
              url = (
                  f"https://api.telegram.org/"
                  f"bot{BOT_TOKEN}/{method}"
              )

              request = urllib.request.Request(
                  url,
                  data=data,
                  headers={
                      "Content-Type": content_type
                  },
                  method="POST",
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=120
                  ) as response:
                      return json.loads(
                          response.read().decode("utf-8")
                      )

              except urllib.error.HTTPError as error:
                  error_body = error.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  print(
                      f"Telegram HTTP error calling {method}:"
                  )

                  print(error_body)

                  raise


          def send_message(text):
              data = urllib.parse.urlencode(
                  {
                      "chat_id": CHANNEL,
                      "text": text
                  }
              ).encode("utf-8")

              return telegram_request(
                  "sendMessage",
                  data
              )


          def send_media_group(image_files):
              boundary = (
                  "----TelegramBoundary123456789"
              )

              body = bytearray()


              def add_field(name, value):
                  body.extend(
                      f"--{boundary}\r\n".encode()
                  )

                  body.extend(
                      (
                          f'Content-Disposition: form-data; '
                          f'name="{name}"\r\n\r\n'
                      ).encode()
                  )

                  body.extend(
                      value.encode("utf-8")
                  )

                  body.extend(b"\r\n")


              media = [
                  {
                      "type": "photo",
                      "media": f"attach://{filename}"
                  }
                  for filename in image_files
              ]


              add_field(
                  "chat_id",
                  CHANNEL
              )

              add_field(
                  "media",
                  json.dumps(media)
              )


              for filename in image_files:
                  body.extend(
                      f"--{boundary}\r\n".encode()
                  )

                  body.extend(
                      (
                          f'Content-Disposition: form-data; '
                          f'name="{filename}"; '
                          f'filename="{filename}"\r\n'
                      ).encode()
                  )

                  body.extend(
                      b"Content-Type: image/jpeg\r\n\r\n"
                  )

                  with open(
                      filename,
                      "rb"
                  ) as file:
                      body.extend(
                          file.read()
                      )

                  body.extend(b"\r\n")


              body.extend(
                  f"--{boundary}--\r\n".encode()
              )


              return telegram_request(
                  "sendMediaGroup",
                  bytes(body),
                  content_type=(
                      "multipart/form-data; "
                      f"boundary={boundary}"
                  ),
              )


          def main():
              print("================================")
              print("AI TELEGRAM AUTO POSTER")
              print("================================")

              print(
                  "Theme:",
                  theme
              )

              print(
                  "Generating prompts with Gemini..."
              )

              result = gemini_generate_prompts()


              title = result.get(
                  "title",
                  "Daily AI Collection"
              )

              prompts = result.get(
                  "prompts"
              )


              if not isinstance(
                  prompts,
                  list
              ):
                  raise Exception(
                      "Gemini did not return a prompt list."
                  )


              if len(prompts) != 4:
                  raise Exception(
                      "Gemini did not return exactly "
                      f"4 prompts. Got {len(prompts)}."
                  )


              print(
                  "Gemini generated 4 prompts."
              )

              print(
                  "Title:",
                  title
              )


              image_files = []


              for i, prompt in enumerate(
                  prompts,
                  start=1
              ):
                  filename = (
                      f"image_{i}.jpg"
                  )

                  print(
                      f"Generating image "
                      f"{i}/4..."
                  )

                  download_image(
                      prompt,
                      filename
                  )

                  image_files.append(
                      filename
                  )


              print(
                  "Uploading 4 images "
                  "to Telegram..."
              )


              telegram_result = send_media_group(
                  image_files
              )


              if not telegram_result.get(
                  "ok"
              ):
                  raise Exception(
                      "Telegram album failed: "
                      + str(telegram_result)
                  )


              print(
                  "4 images posted successfully."
              )


              prompt_message = (
                  f"🎨 {title}\n\n"
              )


              for i, prompt in enumerate(
                  prompts,
                  start=1
              ):
                  prompt_message += (
                      f"━━ IMAGE {i} ━━\n"
                      f"{prompt}\n\n"
                  )


              chunks = [
                  prompt_message[i:i + 4000]
                  for i in range(
                      0,
                      len(prompt_message),
                      4000
                  )
              ]


              for chunk in chunks:
                  send_message(chunk)


              print(
                  "================================"
              )

              print(
                  "SUCCESS: Complete post published."
              )

              print(
                  "================================"
              )


          if __name__ == "__main__":
              main()
          PY

          python bot.py
