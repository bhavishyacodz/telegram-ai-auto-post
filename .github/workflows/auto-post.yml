import json
import os
import urllib.parse
import urllib.request
import urllib.error
import uuid


# ============================================================
# CONFIG
# ============================================================

GEMINI_KEY = os.environ["GEMINI_KEY"]
POLLINATIONS_KEY = os.environ["POLLINATIONS_KEY"]
BOT_TOKEN = os.environ["BOT_TOKEN"]
CHAT_ID = os.environ["CHAT_ID"]

THEME = os.environ.get(
    "THEME",
    "game development, programming, software development and gaming"
)

GEMINI_MODEL = os.environ.get(
    "GEMINI_MODEL",
    "gemini-2.0-flash"
)


# ============================================================
# HTTP HELPER
# ============================================================

def http_request(url, data=None, headers=None, method="GET", timeout=120):
    request = urllib.request.Request(
        url,
        data=data,
        headers=headers or {},
        method=method
    )

    try:
        with urllib.request.urlopen(request, timeout=timeout) as response:
            return response.read()

    except urllib.error.HTTPError as error:
        body = error.read().decode("utf-8", errors="replace")

        print("HTTP ERROR:", error.code)
        print(body)

        raise

    except urllib.error.URLError as error:
        print("URL ERROR:", error)
        raise


# ============================================================
# GEMINI
# ============================================================

def generate_content_with_gemini():
    url = (
        "https://generativelanguage.googleapis.com/v1beta/models/"
        + GEMINI_MODEL
        + ":generateContent"
    )

    prompt = f"""
Create one social-media post about this theme:

{THEME}

Return ONLY valid JSON.

The JSON must have exactly this structure:

{{
  "title": "short catchy title",
  "caption": "engaging caption for Telegram",
  "prompts": [
    "detailed image prompt 1",
    "detailed image prompt 2",
    "detailed image prompt 3",
    "detailed image prompt 4"
  ]
}}

Rules:

- title must be short and catchy
- caption should be useful and engaging
- prompts must contain exactly 4 items
- every image prompt must describe a different visual
- images should be suitable for a professional technology/gaming channel
- do not use markdown
- do not put JSON inside a markdown code block
- return JSON only
"""

    data = {
        "contents": [
            {
                "parts": [
                    {
                        "text": prompt
                    }
                ]
            }
        ],
        "generationConfig": {
            "temperature": 0.8,
            "responseMimeType": "application/json"
        }
    }

    request_data = json.dumps(data).encode("utf-8")

    headers = {
        "Content-Type": "application/json",
        "x-goog-api-key": GEMINI_KEY
    }

    print("Generating content with Gemini...")

    response_data = http_request(
        url,
        data=request_data,
        headers=headers,
        method="POST",
        timeout=120
    )

    result = json.loads(response_data.decode("utf-8"))

    text = (
        result["candidates"][0]
        ["content"]
        ["parts"][0]
        ["text"]
    )

    text = text.strip()

    # Remove accidental markdown fences if Gemini returns them.
    if text.startswith("```"):
        text = text.replace("```json", "", 1)
        text = text.replace("```", "", 1)
        text = text.strip()

    result_json = json.loads(text)

    return result_json


# ============================================================
# POLLINATIONS IMAGE GENERATION
# ============================================================

def generate_image(prompt, image_number):
    print(
        f"Generating image {image_number}/4..."
    )

    encoded_prompt = urllib.parse.quote(
        prompt,
        safe=""
    )

    image_url = (
        "https://gen.pollinations.ai/image/"
        + encoded_prompt
        + "?model=flux"
        + "&width=1024"
        + "&height=1024"
    )

    headers = {
        "Authorization": "Bearer " + POLLINATIONS_KEY
    }

    image_data = http_request(
        image_url,
        headers=headers,
        method="GET",
        timeout=300
    )

    filename = f"image_{image_number}.jpg"

    with open(filename, "wb") as image_file:
        image_file.write(image_data)

    print(
        f"Generated: {filename}"
    )

    return filename


# ============================================================
# TELEGRAM MULTIPART UPLOAD
# ============================================================

def build_multipart(fields, files):
    boundary = "----ChatGPTBoundary" + uuid.uuid4().hex

    body = bytearray()

    for name, value in fields.items():
        body.extend(
            (
                f"--{boundary}\r\n"
                f'Content-Disposition: form-data; name="{name}"\r\n'
                "\r\n"
                f"{value}\r\n"
            ).encode("utf-8")
        )

    for name, filename, content_type, content in files:
        body.extend(
            (
                f"--{boundary}\r\n"
                f'Content-Disposition: form-data; '
                f'name="{name}"; filename="{filename}"\r\n"
                f"Content-Type: {content_type}\r\n"
                "\r\n"
            ).encode("utf-8")
        )

        body.extend(content)
        body.extend(b"\r\n")

    body.extend(
        f"--{boundary}--\r\n".encode("utf-8")
    )

    return bytes(body), boundary


def send_to_telegram(image_files, title, caption):
    print("Uploading 4 images to Telegram...")

    media = []

    for index in range(len(image_files)):
        item = {
            "type": "photo",
            "media": f"attach://file{index}"
        }

        # Put title + caption on the first image.
        if index == 0:
            item["caption"] = (
                f"{title}\n\n"
                f"{caption}"
            )

        media.append(item)

    fields = {
        "chat_id": CHAT_ID,
        "media": json.dumps(media)
    }

    files = []

    for index, filename in enumerate(image_files):
        with open(filename, "rb") as image_file:
            content = image_file.read()

        files.append(
            (
                f"file{index}",
                filename,
                "image/jpeg",
                content
            )
        )

    body, boundary = build_multipart(
        fields,
        files
    )

    url = (
        "https://api.telegram.org/bot"
        + BOT_TOKEN
        + "/sendMediaGroup"
    )

    headers = {
        "Content-Type": (
            "multipart/form-data; boundary="
            + boundary
        )
    }

    response_data = http_request(
        url,
        data=body,
        headers=headers,
        method="POST",
        timeout=120
    )

    result = json.loads(
        response_data.decode("utf-8")
    )

    if not result.get("ok"):
        raise Exception(
            "Telegram API error: "
            + json.dumps(result)
        )

    print("Telegram upload successful.")


# ============================================================
# MAIN
# ============================================================

def main():
    print("=" * 50)
    print("AI TELEGRAM AUTO POSTER")
    print("=" * 50)

    print()
    print("Theme:", THEME)
    print()

    # --------------------------------------------------------
    # 1. Generate title, caption and 4 prompts
    # --------------------------------------------------------

    result = generate_content_with_gemini()

    title = result["title"]
    caption = result["caption"]
    prompts = result["prompts"]

    if not isinstance(prompts, list):
        raise Exception(
            "Gemini did not return a prompt list."
        )

    if len(prompts) != 4:
        raise Exception(
            "Gemini did not return exactly 4 prompts."
        )

    print()
    print("Title:", title)
    print()

    # --------------------------------------------------------
    # 2. Generate exactly 4 images
    # --------------------------------------------------------

    image_files = []

    for i, prompt in enumerate(prompts, 1):

        image_file = generate_image(
            prompt,
            i
        )

        image_files.append(
            image_file
        )

    if len(image_files) != 4:
        raise Exception(
            "Image generation did not produce 4 images."
        )

    # --------------------------------------------------------
    # 3. Upload all 4 images to Telegram
    # --------------------------------------------------------

    send_to_telegram(
        image_files,
        title,
        caption
    )

    # --------------------------------------------------------
    # 4. Cleanup
    # --------------------------------------------------------

    for filename in image_files:
        try:
            os.remove(filename)
        except OSError:
            pass

    print()
    print("=" * 50)
    print("DONE")
    print("=" * 50)


# ============================================================
# ENTRY POINT
# ============================================================

if __name__ == "__main__":
    main()
